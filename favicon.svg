<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="40%" stop-color="#1e3a8a" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>

    <!-- Pin Gradient -->
    <linearGradient id="pinGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f87171" />
      <stop offset="50%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#b91c1c" />
    </linearGradient>

    <!-- Road Gradient -->
    <linearGradient id="roadGrad" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Squircle Base with drop shadow -->
  <rect x="24" y="24" width="464" height="464" rx="104" fill="url(#bgGrad)" stroke="#60a5fa" stroke-width="6" stroke-opacity="0.4" />

  <!-- Road Canvas (Perspective Trapezoid) -->
  <polygon points="196,170 316,170 390,440 122,440" fill="url(#roadGrad)" stroke="#475569" stroke-width="4" />

  <!-- Road Dashed Centerline -->
  <line x1="256" y1="185" x2="256" y2="235" stroke="#facc15" stroke-width="10" stroke-linecap="round" />
  <line x1="256" y1="260" x2="256" y2="325" stroke="#facc15" stroke-width="12" stroke-linecap="round" />
  <line x1="256" y1="355" x2="256" y2="430" stroke="#facc15" stroke-width="15" stroke-linecap="round" />

  <!-- Road Edge Glow Lines -->
  <line x1="196" y1="170" x2="122" y2="440" stroke="#38bdf8" stroke-width="4" stroke-opacity="0.6" />
  <line x1="316" y1="170" x2="390" y2="440" stroke="#38bdf8" stroke-width="4" stroke-opacity="0.6" />

  <!-- Camera Lens / Geo-Tag Ring behind Pin -->
  <circle cx="256" cy="180" r="76" stroke="#38bdf8" stroke-width="6" stroke-dasharray="16 10" stroke-opacity="0.75" />
  <circle cx="256" cy="180" r="95" stroke="#60a5fa" stroke-width="3" stroke-dasharray="6 8" stroke-opacity="0.4" />

  <!-- Google Map Pin with shadow -->
  <g filter="url(#glow)">
    <path d="M256 70 C198 70 152 116 152 174 C152 245 256 348 256 348 C256 348 360 245 360 174 C360 116 314 70 256 70 Z" fill="url(#pinGrad)" stroke="#ffffff" stroke-width="8" />
    <!-- Pin Inner Circle (Camera Aperture / White Dot) -->
    <circle cx="256" cy="165" r="40" fill="#ffffff" />
    <circle cx="256" cy="165" r="24" fill="#0f172a" />
    <circle cx="256" cy="165" r="10" fill="#38bdf8" />
  </g>

  <!-- GPS Star Sparkle -->
  <path d="M370 100 Q390 100 390 80 Q390 100 410 100 Q390 100 390 120 Q390 100 370 100 Z" fill="#fbbf24" />
</svg>
